<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23495f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flashcard">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Flashcard</title>
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --ink:#1f2933; --muted:#6b7280;
  --line:#dedbd3; --accent:#23495f; --accent-soft:#e4eef3;
  --answer:#f4ead8; --shadow:0 8px 26px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button{font:inherit}
.app{max-width:1100px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--accent);color:white;display:grid;place-items:center;font-size:28px}
h1{margin:0;font-size:clamp(25px,4vw,39px)}
.subtitle{color:var(--muted);font-size:14px;margin-top:3px}
.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.tile{border:1px solid var(--line);border-radius:17px;background:white;padding:18px;text-align:left;cursor:pointer;min-height:108px;transition:.12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(0,0,0,.07)}
.tile strong{display:block;font-size:21px;margin-bottom:7px}
.tile span{color:var(--muted);font-size:14px}
.discipline-icon{font-size:28px;margin-bottom:8px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:13px}
.back{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}
.breadcrumb{font-weight:700;color:var(--accent)}
.study{max-width:950px;margin:auto}
.flash-wrap{perspective:1300px;min-height:500px}
.flashcard{position:relative;width:100%;min-height:500px;transform-style:preserve-3d;transition:transform .38s;cursor:pointer}
.flashcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;border:2px solid var(--line);
      display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
      padding:36px;background:white;box-shadow:var(--shadow);overflow:hidden}
.face.answer{transform:rotateY(180deg);background:var(--answer)}
.face-label{position:absolute;top:18px;left:20px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.question-text{font-weight:700;font-size:clamp(27px,4.5vw,46px);line-height:1.22;white-space:pre-line}
.answer-text{font-size:clamp(28px,4vw,43px);line-height:1.25;white-space:pre-line}
.card-image{max-width:88%;max-height:360px;object-fit:contain;border-radius:12px}
.question-text.with-image{font-size:clamp(18px,3vw,28px);margin-top:18px}
.controls{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:11px;margin-top:14px}
.controls button{min-height:62px;border-radius:15px;border:1px solid var(--line);font-weight:700;font-size:18px;cursor:pointer;background:white}
.controls .primary{background:var(--accent);color:white;border-color:var(--accent)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 2px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.shuffle{border:1px solid var(--line);background:white;border-radius:11px;padding:8px 12px;cursor:pointer}
.hidden{display:none!important}
.empty{color:var(--muted);padding:30px;text-align:center}
.note{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.4}
@media(max-width:650px){
 .app{padding:10px}
 .flash-wrap,.flashcard{min-height:58vh}
 .face{padding:28px 17px}
 .card-image{max-height:42vh}
 .controls{grid-template-columns:1fr 1fr}
 .controls .primary{grid-column:1/-1;grid-row:1}
}

/* FLASHCARD_TABLET_TOUCH */
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
button,.tile,.flashcard{-webkit-tap-highlight-color:transparent}
button,.tile{touch-action:manipulation}
@media (pointer:coarse){
  .tile{min-height:118px}
  .back,.shuffle{min-height:48px}
  .controls button{min-height:68px}
}

</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">🗂️</div>
    <div>
      <h1>Flashcard</h1>
      <div class="subtitle" id="subtitle">Choisis une discipline</div>
    </div>
  </div>
</header>

<section id="home" class="card-panel">
  <h2 style="margin-top:0">Disciplines</h2>
  <div id="disciplineGrid" class="grid"></div>
  
</section>

<section id="themes" class="hidden">
  <div class="topbar">
    <button class="back" id="themesBack">← Disciplines</button>
    <div class="breadcrumb" id="disciplineName"></div>
  </div>
  <div class="card-panel">
    <h2 style="margin-top:0">Choisir un thème</h2>
    <div id="themeGrid" class="grid"></div>
  </div>
</section>

<section id="study" class="study hidden">
  <div class="topbar">
    <button class="back" id="studyBack">← Thèmes</button>
    <div class="breadcrumb" id="studyTitle"></div>
    <button class="shuffle" id="shuffle">🔀 Mélanger</button>
  </div>
  <div class="meta">
    <span id="progress"></span>
    <span id="modeHint">Touchez la carte pour la retourner</span>
  </div>
  <div class="flash-wrap">
    <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="Retourner la carte">
      <div class="face question">
        <div class="face-label">Question</div>
        <img id="questionImage" class="card-image hidden" alt="">
        <div id="questionText" class="question-text"></div>
      </div>
      <div class="face answer">
        <div class="face-label">Réponse</div>
        <div id="answerText" class="answer-text"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="prev">← Précédente</button>
    <button id="flip" class="primary">Retourner</button>
    <button id="next">Suivante →</button>
  </div>
</section>
</div>

<script>
const DB = window.FLASHCARDS_DB;
const icons = {"Histoire":"🏺","Géographie":"🌍","Sciences":"🔬","English":"🇬🇧","Poésies":"🪶"};
let discipline=null, theme=null, cards=[], index=0, flipped=false;

const $=id=>document.getElementById(id);
function show(name){
  ["home","themes","study"].forEach(id=>$(id).classList.toggle("hidden",id!==name));
}
function countCards(d){return d.themes.reduce((n,t)=>n+t.cards.length,0)}

function renderDisciplines(){
  const box=$("disciplineGrid"); box.innerHTML="";
  DB.disciplines.forEach(d=>{
    const b=document.createElement("button"); b.className="tile";
    b.innerHTML=`<div class="discipline-icon">${icons[d.name]||"📚"}</div><strong>${escapeHtml(d.name)}</strong><span>${d.themes.length} thèmes • ${countCards(d)} cartes</span>`;
    b.onclick=()=>openDiscipline(d);
    box.appendChild(b);
  });
  $("subtitle").textContent=`${DB.disciplines.reduce((n,d)=>n+countCards(d),0)} cartes disponibles`;
}
function openDiscipline(d){
  discipline=d; $("disciplineName").textContent=d.name;
  $("subtitle").textContent=d.name;
  const box=$("themeGrid"); box.innerHTML="";
  d.themes.forEach(t=>{
    const b=document.createElement("button"); b.className="tile";
    b.innerHTML=`<strong>${escapeHtml(t.name)}</strong><span>${t.cards.length} cartes</span>`;
    b.onclick=()=>openTheme(t);
    box.appendChild(b);
  });
  show("themes");
}
function openTheme(t){
  theme=t; cards=t.cards.map(c=>({...c})); index=0;
  $("studyTitle").textContent=`${discipline.name} › ${t.name}`;
  $("subtitle").textContent=t.name;
  renderCard(); show("study");
}
function renderCard(){
  if(!cards.length)return;
  flipped=false; $("flashcard").classList.remove("flipped");
  const c=cards[index];
  const img=$("questionImage"), qt=$("questionText");
  if(c.image){
    img.src=c.image; img.classList.remove("hidden");
    img.onerror=()=>{img.classList.add("hidden");};
  }else{
    img.removeAttribute("src"); img.classList.add("hidden");
  }
  qt.textContent=c.question||"";
  qt.classList.toggle("with-image",!!c.image && !!c.question);
  // Pour les cartes purement illustrées, ne pas afficher de blanc gênant
  qt.classList.toggle("hidden",!c.question);
  $("answerText").textContent=c.answer||"";
  $("progress").textContent=`Carte ${index+1} / ${cards.length}`;
  $("flip").textContent="Retourner";
}
function flip(){
  flipped=!flipped; $("flashcard").classList.toggle("flipped",flipped);
  $("flip").textContent=flipped?"Voir la question":"Retourner";
}
function move(n){index=(index+n+cards.length)%cards.length; renderCard()}
function shuffle(){
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}
  index=0;renderCard();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

$("themesBack").onclick=()=>{show("home");$("subtitle").textContent="Choisis une discipline"};
$("studyBack").onclick=()=>{show("themes");$("subtitle").textContent=discipline.name};
$("flashcard").onclick=flip; $("flip").onclick=flip;
$("prev").onclick=()=>move(-1); $("next").onclick=()=>move(1); $("shuffle").onclick=shuffle;
$("flashcard").onkeydown=e=>{
 if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}
 if(e.key==="ArrowRight")move(1);
 if(e.key==="ArrowLeft")move(-1);
};
renderDisciplines();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
