<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Questions / Réponses">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Questions / Réponses</title>
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --ink:#1f2933; --muted:#6b7280;
  --line:#dedbd3; --accent:#23495f; --accent-soft:#e4eef3;
  --answer:#f4ead8; --shadow:0 8px 26px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button{font:inherit}
.app{max-width:1100px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--accent);color:white;display:grid;place-items:center;font-size:28px}
h1{margin:0;font-size:clamp(25px,4vw,39px)}
.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.tile{border:1px solid var(--line);border-radius:17px;background:white;padding:18px;text-align:left;cursor:pointer;min-height:108px;transition:.12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(0,0,0,.07)}
.tile strong{display:block;font-size:21px;margin-bottom:7px}
.tile span{color:var(--muted);font-size:14px}
.discipline-icon{font-size:28px;margin-bottom:8px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:13px}
.back{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}
.breadcrumb{font-weight:700;color:var(--accent)}
.study{max-width:950px;margin:auto}
.flash-wrap{perspective:1300px;min-height:500px}
.flashcard{position:relative;width:100%;min-height:500px;transform-style:preserve-3d;transition:transform .38s;cursor:pointer}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard.no-transition{transition:none!important}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;border:2px solid var(--line);
      display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
      padding:36px;background:white;box-shadow:var(--shadow);overflow:hidden}
.face.answer{transform:rotateY(180deg);background:var(--answer)}
.face-label{position:absolute;top:18px;left:20px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.question-text{font-weight:700;font-size:clamp(27px,4.5vw,46px);line-height:1.22;white-space:pre-line}
.answer-text{font-size:clamp(28px,4vw,43px);line-height:1.25;white-space:pre-line}
.card-image{max-width:88%;max-height:360px;object-fit:contain;border-radius:12px}
.question-text.with-image{font-size:clamp(18px,3vw,28px);margin-top:18px}
.controls{display:flex;justify-content:center;margin-top:14px}
.controls button{min-height:62px;min-width:min(320px,100%);border-radius:15px;border:1px solid var(--line);font-weight:700;font-size:18px;cursor:pointer;background:white}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 2px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.hidden{display:none!important}
.empty{color:var(--muted);padding:30px;text-align:center}
.note{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.4}
@media(max-width:650px){
 .app{padding:10px}
 .flash-wrap,.flashcard{min-height:58vh}
 .face{padding:28px 17px}
 .card-image{max-height:42vh}
}

/* FLASHCARD_TABLET_TOUCH */
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
button,.tile,.flashcard{-webkit-tap-highlight-color:transparent}
button,.tile{touch-action:manipulation}
@media (pointer:coarse){
  .tile{min-height:118px}
  .back{min-height:48px}
  .controls button{min-height:68px}
}

</style>
</head>

<div class="app">
<header>
  <div class="brand">
    <div class="logo">🗂️</div>
    <div>
      <h1>Questions / Réponses</h1>
    </div>
  </div>
</header>

<section id="home" class="card-panel">
  <h2 style="margin-top:0">Disciplines</h2>
  <div id="disciplineGrid" class="grid"></div>
  
</section>

<section id="themes" class="hidden">
  <div class="topbar">
    <button class="back" id="themesBack">← Disciplines</button>
    <div class="breadcrumb" id="disciplineName"></div>
  </div>
  <div class="card-panel">
    <h2 style="margin-top:0">Choisir un paquet</h2>
    <div id="themeGrid" class="grid"></div>
  </div>
</section>

<section id="study" class="study hidden">
  <div class="topbar">
    <button class="back" id="studyBack">← Paquets</button>
    <div class="breadcrumb" id="studyTitle"></div>
  </div>
  <div class="meta">
    <span id="progress"></span>
    <span id="modeHint">Touchez la carte pour voir la réponse</span>
  </div>
  <div class="flash-wrap">
    <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="Afficher la réponse">
      <div class="face question">
        <div class="face-label">Question</div>
        <img id="questionImage" class="card-image hidden" alt="">
        <div id="questionText" class="question-text"></div>
      </div>
      <div class="face answer">
        <div class="face-label">Réponse</div>
        <div id="answerText" class="answer-text"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="prev">← Précédente</button>
  </div>
</section>
</div>

<script>
const DB = window.FLASHCARDS_DB;
const fallbackIcons = {
  "Histoire":"🏺",
  "Géographie":"🌍",
  "Sciences":"🔬",
  "English":"🇬🇧",
  "Poésies":"🪶",
  "Français":"✍️",
  "Ceintures d'histoire":"🎗️",
  "Histoire des arts":"🎨"
};
let discipline=null, theme=null, cards=[], index=0, flipped=false;

const $=id=>document.getElementById(id);
function show(name){
  ["home","themes","study"].forEach(id=>$(id).classList.toggle("hidden",id!==name));
}
function countCards(d){
  return d.themes.reduce((n,t)=>n+t.cards.length,0);
}
function iconFor(d){return d.icon || fallbackIcons[d.name] || "📚"}
function shuffled(list){
  const a=list.map(x=>({...x}));
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function shuffledRefs(list){
  const a=list.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Tire les anciennes cartes de façon aléatoire MAIS équilibrée entre les
// paquets précédents. Tant qu'il y a assez de paquets, un même paquet ne
// fournit pas une deuxième carte avant que les autres aient pu en fournir une.
function pickBalancedOldCards(t, wanted){
  wanted=Math.max(0,Number(wanted)||0);
  if(!wanted)return [];

  const previous=discipline.themes
    .filter(p=>Number(p.order)<Number(t.order) && p.cards && p.cards.length)
    .map(p=>({name:p.name,cards:shuffled(p.cards)}));

  let buckets=previous;
  const selected=[];
  while(selected.length<wanted && buckets.length){
    const round=shuffledRefs(buckets);
    for(const bucket of round){
      if(selected.length>=wanted)break;
      if(bucket.cards.length)selected.push(bucket.cards.pop());
    }
    buckets=buckets.filter(b=>b.cards.length);
  }
  return selected;
}

function buildSession(t){
  const allCurrent=t.cards||[];
  const requestedCurrent=t.currentQuestions;
  let current;
  if(requestedCurrent===null || requestedCurrent===undefined || requestedCurrent===""){
    current=shuffled(allCurrent);
  }else{
    const n=Math.max(0,Number(requestedCurrent)||0);
    current=shuffled(allCurrent).slice(0,n);
  }

  const old=pickBalancedOldCards(t,t.oldQuestions||0);
  return shuffled([...current,...old]);
}

function renderDisciplines(){
  const box=$("disciplineGrid"); box.innerHTML="";
  DB.disciplines.forEach(d=>{
    const b=document.createElement("button"); b.className="tile";
    b.innerHTML=`<div class="discipline-icon">${escapeHtml(iconFor(d))}</div><strong>${escapeHtml(d.name)}</strong><span>${d.themes.length} paquets • ${countCards(d)} cartes</span>`;
    b.onclick=()=>openDiscipline(d);
    box.appendChild(b);
  });
}
function openDiscipline(d){
  discipline=d; $("disciplineName").textContent=d.name;
  const box=$("themeGrid"); box.innerHTML="";
  d.themes.forEach(t=>{
    const b=document.createElement("button"); b.className="tile";
    const cur=(t.currentQuestions===null || t.currentQuestions===undefined) ? "Toutes" : String(t.currentQuestions);
    const old=Math.max(0,Number(t.oldQuestions)||0);
    let detail;
    if(old>0){
      detail=`${cur} du paquet + ${old} ancienne${old>1?"s":""}`;
    }else if(cur==="Toutes"){
      detail=`${t.cards.length} carte${t.cards.length>1?"s":""}`;
    }else{
      detail=`${cur} du paquet`;
    }
    b.innerHTML=`<strong>${escapeHtml(t.name)}</strong><span>${escapeHtml(detail)}</span>`;
    b.onclick=()=>openTheme(t);
    box.appendChild(b);
  });
  show("themes");
}
function openTheme(t){
  theme=t; cards=buildSession(t); index=0;
  $("studyTitle").textContent=`${discipline.name} › ${t.name}`;
  renderCard(); show("study");
}
function resetFlipInstant(){
  const fc=$("flashcard");
  fc.classList.add("no-transition");
  fc.classList.remove("flipped");
  flipped=false;
  void fc.offsetWidth;
  fc.classList.remove("no-transition");
}
function renderCard(){
  if(!cards.length){
    $("progress").textContent="Aucune carte dans cette séance";
    $("questionText").textContent="Aucune carte disponible";
    $("answerText").textContent="";
    return;
  }
  flipped=false; $("flashcard").classList.remove("flipped");
  const c=cards[index];
  const img=$("questionImage"), qt=$("questionText");
  if(c.image){
    img.src=c.image; img.classList.remove("hidden");
    img.onerror=()=>{img.classList.add("hidden");};
  }else{
    img.removeAttribute("src"); img.classList.add("hidden");
  }
  qt.textContent=c.question||"";
  qt.classList.toggle("with-image",!!c.image && !!c.question);
  qt.classList.toggle("hidden",!c.question);
  $("answerText").textContent=c.answer||"";
  $("progress").textContent=`Carte ${index+1} / ${cards.length}`;
  $("modeHint").textContent="Touchez la carte pour voir la réponse";
  $("flashcard").setAttribute("aria-label","Afficher la réponse");
}
function showAnswer(){
  if(flipped)return;
  flipped=true;
  $("flashcard").classList.add("flipped");
  $("modeHint").textContent="Touchez la réponse pour passer à la carte suivante";
  $("flashcard").setAttribute("aria-label","Passer à la carte suivante");
}
function move(n){
  if(!cards.length)return;
  // Très important : si l'on quitte une réponse, on remet d'abord la carte
  // côté question SANS animation. Le texte de la carte suivante n'est changé
  // qu'ensuite, donc sa réponse ne peut plus apparaître pendant la rotation.
  if(flipped)resetFlipInstant();
  index=(index+n+cards.length)%cards.length;
  renderCard();
}
function cardTap(){
  if(!flipped)showAnswer();
  else move(1);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

$("themesBack").onclick=()=>show("home");
$("studyBack").onclick=()=>show("themes");
$("flashcard").onclick=cardTap;
$("prev").onclick=()=>move(-1);
$("flashcard").onkeydown=e=>{
 if(e.key==="Enter"||e.key===" "){e.preventDefault();cardTap()}
 if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}
};
renderDisciplines();

</script>
















<script>
window.FLASHCARD_BUILD = "20260916193635";
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("./sw.js");
      await reg.update();

      // Si un nouveau service worker prend le contrôle, recharge une seule fois
      // afin d’afficher immédiatement la nouvelle base de cartes.
      let reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });

      // Vérification supplémentaire à chaque retour dans Flashcard.
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) reg.update().catch(() => {});
      });
    } catch (_) {
      // Hors connexion : on garde simplement la dernière version en cache.
    }
  });
}
</script>
